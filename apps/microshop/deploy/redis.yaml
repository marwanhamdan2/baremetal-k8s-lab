# ============================================================================
# Redis — the hand-rolled StatefulSet pattern (contrast with the operator-
# managed Postgres next door): stable identity, AOF persistence on a Longhorn
# PVC. Prod-scale paths documented in docs/70: Sentinel/Cluster, or Valkey.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: microshop
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        fsGroup: 999
      # deterministic volume ownership: fsGroup alone proved unreliable on a
      # reused Longhorn mount — a root init chown always works
      initContainers:
        - name: fix-perms
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:1000 /data"]
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: microshop
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379

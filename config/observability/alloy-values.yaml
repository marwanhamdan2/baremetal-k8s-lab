# ============================================================================
# Grafana Alloy — the log collector (successor of the EOL'd Promtail).
# Runs as a single Deployment tailing all pod logs via the kubelet API and
# shipping to Loki with k8s labels attached.
#
# Prod variant (documented in docs/50-observability.md): DaemonSet + file
# tailing from /var/log/pods with clustering — needed at real node counts.
# ============================================================================
controller:
  type: deployment
  replicas: 1

alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc:3100/loki/api/v1/push"
        }
      }

serviceMonitor:
  enabled: true

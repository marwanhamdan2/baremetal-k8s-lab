# Observability UIs through the shared Gateway (wildcard *.k8s.lab TLS):
#   grafana.k8s.lab | prometheus.k8s.lab | alertmanager.k8s.lab
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: lab-gateway
      namespace: infra
  hostnames: ["grafana.k8s.lab"]
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: observability
spec:
  parentRefs:
    - name: lab-gateway
      namespace: infra
  hostnames: ["prometheus.k8s.lab"]
  rules:
    - backendRefs:
        - name: kps-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: observability
spec:
  parentRefs:
    - name: lab-gateway
      namespace: infra
  hostnames: ["alertmanager.k8s.lab"]
  rules:
    - backendRefs:
        - name: kps-alertmanager
          port: 9093
